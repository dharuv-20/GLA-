<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Academy Content Manager | The Global Language Academy</title>
  <!-- Netlify Identity Widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Include Decap CMS CDN -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Initialize the CMS programmatically using programmatic configuration injection
    CMS.init({
      config: {
        backend: {
          name: 'git-gateway',
          branch: 'main',
        },
        media_folder: 'public/images',
        public_folder: '/images',
        collections: [
          {
            name: 'blogs',
            label: 'Blogs',
            folder: 'src/content/blogs',
            create: true,
            slug: '{{slug}}',
            format: 'json',
            fields: [
              { label: 'ID', name: 'id', widget: 'number', value_type: 'int' },
              { label: 'Title', name: 'title', widget: 'string' },
              { label: 'Category', name: 'category', widget: 'select', options: ['IELTS', 'PTE', 'German', 'Career'] },
              { label: 'Author', name: 'author', widget: 'string' },
              { label: 'Read Time', name: 'readTime', widget: 'string' },
              { label: 'Excerpt', name: 'excerpt', widget: 'text' },
              {
                label: 'Content Paragraphs',
                name: 'content',
                widget: 'list',
                field: { label: 'Paragraph', name: 'paragraph', widget: 'text' }
              }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
